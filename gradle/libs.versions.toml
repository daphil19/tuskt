[versions]
# NOTE this is lower than the minimum version needed to run gradle, to help maximize compatibility
jdk = "17"
kotlin = "2.3.0"
android-compileSdk = "36"
android-minSdk = "21"
# ktor versioning defined in version catalog in settings.gradle.kts
#ktor = "3.4.0"
ktlint = "1.8.0"
jimfs = "1.3.1"
kotlinLogging = "7.0.14"
coroutines = "1.10.2"

[libraries]
#ktor-version-catalog = { module = "io.ktor:ktor-version-catalog", version.ref = "ktor" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
jimfs = { module = "com.google.jimfs:jimfs", version.ref = "jimfs" }
kotlinLogging = { module = "io.github.oshai:kotlin-logging", version.ref = "kotlinLogging"}
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
[bundles]

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
versions = { id = "com.github.ben-manes.versions", version = "0.53.0" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version = "8.13.2" }
detekt = { id = "io.gitlab.arturbosch.detekt", version = "1.23.8" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version = "14.0.1" }
vanniktech-mavenPublish = { id = "com.vanniktech.maven.publish", version = "0.36.0" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
#ktor = { id = "io.ktor.plugin", version.ref = "ktor" }
