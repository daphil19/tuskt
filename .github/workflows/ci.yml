name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_changed: ${{ steps.classify.outputs.docs_changed }}
      code_changed: ${{ steps.classify.outputs.code_changed }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changes
        id: classify
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
            mapfile -t changed_files < <(git diff --name-only "$base_sha" "$head_sha")
          elif [[ "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]]; then
            mapfile -t changed_files < <(git diff-tree --no-commit-id --name-only -r "${{ github.sha }}")
          else
            mapfile -t changed_files < <(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
          fi

          docs_changed=false
          code_changed=false

          for file in "${changed_files[@]}"; do
            [[ -z "$file" ]] && continue

            case "$file" in
              docs/*|mkdocs.yml|pyproject.toml|uv.lock|.github/workflows/docs.yml)
                docs_changed=true
                ;;
              *)
                code_changed=true
                ;;
            esac
          done

          echo "docs_changed=$docs_changed" >> "$GITHUB_OUTPUT"
          echo "code_changed=$code_changed" >> "$GITHUB_OUTPUT"

  validate:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        if: needs.changes.outputs.code_changed == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        if: needs.changes.outputs.code_changed == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Run lint and JVM tests
        if: needs.changes.outputs.code_changed == 'true'
        run: ./gradlew ktlintCheck detekt test

      - name: Run multiplatform test matrix
        if: needs.changes.outputs.code_changed == 'true'
        run: ./gradlew :shared:allTests :tuskt-client:allTests

      - name: Build standalone jar
        if: needs.changes.outputs.code_changed == 'true'
        run: ./gradlew :tuskt-server-standalone:shadowJar

      - name: Skip Gradle validation for docs-only changes
        if: needs.changes.outputs.code_changed != 'true'
        run: echo "Skipping Gradle validation because no code paths changed."
