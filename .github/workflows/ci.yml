name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run lint and JVM tests
        run: ./gradlew ktlintCheck detekt test

      - name: Run multiplatform test matrix
        run: ./gradlew :shared:allTests :tuskt-client:allTests

      - name: Build standalone jar
        run: ./gradlew :tuskt-server-standalone:shadowJar
