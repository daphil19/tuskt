name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
  ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
  ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
  ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY_CONTENTS || secrets.MAVEN_PUBLISHING_SIGNING_KEY }}
  ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD || secrets.MAVEN_PUBLISHING_SIGNING_PASSWORD }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: metadata
        shell: bash
        run: |
          tag="${GITHUB_REF##refs/tags/}"
          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Tag must match vX.Y.Z: $tag" >&2
            exit 1
          fi
          version="${tag#v}"
          repo_version="$(awk -F= '$1 == "VERSION_NAME" { print $2 }' gradle.properties | tr -d '[:space:]')"
          if [[ "$repo_version" != "$version" ]]; then
            echo "Tag version $version does not match VERSION_NAME $repo_version" >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare release notes artifact
        run: >
          ./gradlew
          --no-configuration-cache
          --quiet
          getChangelog
          --project-version="${{ steps.metadata.outputs.version }}"
          --no-links
          --no-empty-sections
          --output-file=release-notes.md

      - name: Upload changelog excerpt
        uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: release-notes.md

  publish-mavencentral:
    needs: preflight
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate release build
        run: ./gradlew ktlintCheck detekt test :shared:allTests :tuskt-client:allTests

      - name: Validate Maven Central publishing configuration
        run: >
          ./gradlew
          --no-configuration-cache
          :shared:checkSigningConfiguration
          :tuskt-client:checkSigningConfiguration
          :tuskt-server:checkSigningConfiguration

      - name: Publish dependency modules to Maven Central
        run: >
          ./gradlew
          --no-configuration-cache
          :shared:publishAndReleaseToMavenCentral
          :tuskt-client:publishAndReleaseToMavenCentral
          :tuskt-server:publishAndReleaseToMavenCentral

      - name: Build standalone release assets
        run: |
          ./gradlew :tuskt-server-standalone:shadowJar
          mkdir -p release-assets
          cp tuskt-server-standalone/build/libs/*.jar release-assets/
          cd release-assets
          for file in *.jar; do
            shasum -a 256 "$file" > "$file.sha256"
          done

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release-assets/*

  github-release:
    needs:
      - preflight
      - publish-mavencentral
    runs-on: ubuntu-latest

    steps:
      - name: Download changelog excerpt
        uses: actions/download-artifact@v4
        with:
          name: changelog
          path: release-notes

      - name: Download standalone jar
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          body_path: release-notes/release-notes.md
          files: release-assets/*
